---
# ══════════════════════════════════════════
# FREESWITCH — Deployment + NodePort Services
# Note: FreeSWITCH needs hostNetwork or NodePort for SIP/RTP
# ══════════════════════════════════════════
{{- if .Values.freeswitch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-freeswitch
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-freeswitch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpaas-freeswitch
  template:
    metadata:
      labels:
        app: cpaas-freeswitch
    spec:
      # hostNetwork needed for SIP/RTP to work with real IPs
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: freeswitch
          image: {{ .Values.freeswitch.image }}
          imagePullPolicy: {{ .Values.freeswitch.imagePullPolicy }}
          env:
            - name: BACKEND_API_URL
              value: "http://cpaas-backend:8080"
            - name: ESL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: ESL_PASSWORD
            - name: FREESWITCH_DOMAIN
              value: {{ .Values.freeswitch.domain | quote }}
            - name: EXT_SIP_IP
              value: {{ .Values.global.vpsIp | quote }}
            - name: LIVEKIT_SIP_HOST
              value: "cpaas-livekit-sip"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: INTERNAL_API_KEY
          ports:
            - name: sip-ext
              containerPort: 5080
              protocol: UDP
            - name: sip-ext-tcp
              containerPort: 5080
              protocol: TCP
            - name: sip-int
              containerPort: 5060
              protocol: UDP
            - name: esl
              containerPort: 8021
          livenessProbe:
            exec:
              command: ["fs_cli", "-x", "status"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-freeswitch
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-freeswitch
  # ClusterIP only — hostNetwork handles external exposure
  type: ClusterIP
  ports:
    - name: sip-ext-udp
      port: 5080
      targetPort: 5080
      protocol: UDP
    - name: sip-ext-tcp
      port: 5080
      targetPort: 5080
      protocol: TCP
    - name: esl
      port: 8021
      targetPort: 8021
{{- end }}
