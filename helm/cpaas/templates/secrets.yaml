---
# ══════════════════════════════════════════
# SECRETS — كل الـ credentials في secret واحد
# ══════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: cpaas-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpaas.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  REDIS_URL: "redis://cpaas-redis:6379"
  MINIO_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
  LIVEKIT_API_KEY: {{ .Values.livekit.apiKey | quote }}
  LIVEKIT_API_SECRET: {{ .Values.livekit.apiSecret | quote }}

  JWT_KEY: {{ .Values.backend.jwtKey | quote }}
  JWT_ISSUER: {{ .Values.backend.jwtIssuer | quote }}
  JWT_AUDIENCE: {{ .Values.backend.jwtAudience | quote }}
  INTERNAL_API_KEY: {{ .Values.backend.internalApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.agent.geminiApiKey | quote }}
  CONNECTION_STRING: {{ include "cpaas.postgresConn" . | quote }}
