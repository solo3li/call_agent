---
# ══════════════════════════════════════════
# LIVEKIT SERVER ConfigMap
# ══════════════════════════════════════════
{{- if .Values.livekit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpaas-livekit-config
  namespace: {{ .Values.namespace }}
data:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50200
      use_external_ip: true
    keys:
      {{ .Values.livekit.apiKey }}: {{ .Values.livekit.apiSecret }}
    webhook:
      api_key: {{ .Values.livekit.apiKey }}
      urls:
        - "http://cpaas-backend:8080/api/webhook/livekit"
    logging:
      level: info
    redis:
      address: cpaas-redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-livekit
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpaas-livekit
  template:
    metadata:
      labels:
        app: cpaas-livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          image: {{ .Values.livekit.image }}
          args: ["--config", "/etc/livekit/livekit.yaml"]
          ports:
            - name: api
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            - name: rtc-udp
              containerPort: 50000
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
      volumes:
        - name: config
          configMap:
            name: cpaas-livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-livekit
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-livekit
  ports:
    - name: api
      port: 7880
      targetPort: 7880
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
{{- end }}
---
# ══════════════════════════════════════════
# LIVEKIT SIP BRIDGE
# ══════════════════════════════════════════
{{- if .Values.livekitSip.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpaas-livekit-sip-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    api_key: {{ .Values.livekit.apiKey }}
    api_secret: {{ .Values.livekit.apiSecret }}
    ws_url: ws://cpaas-livekit:7880
    sip_port: 5060
    use_external_ip: true
    redis:
      address: cpaas-redis:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-livekit-sip
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-livekit-sip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpaas-livekit-sip
  template:
    metadata:
      labels:
        app: cpaas-livekit-sip
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit-sip
          image: {{ .Values.livekitSip.image }}
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /sip
      volumes:
        - name: config
          configMap:
            name: cpaas-livekit-sip-config
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-livekit-sip
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-livekit-sip
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP
{{- end }}
