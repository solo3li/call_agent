---
# ══════════════════════════════════════════
# POSTGRESQL — StatefulSet + Service + PVC
# ══════════════════════════════════════════
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpaas-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cpaas-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-postgres
    {{- include "cpaas.labels" . | nindent 4 }}
spec:
  serviceName: cpaas-postgres
  replicas: 1
  selector:
    matchLabels:
      app: cpaas-postgres
  template:
    metadata:
      labels:
        app: cpaas-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.postgres.username }}]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cpaas-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
---
# ══════════════════════════════════════════
# REDIS
# ══════════════════════════════════════════
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpaas-redis
  template:
    metadata:
      labels:
        app: cpaas-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-redis
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
---
# ══════════════════════════════════════════
# MINIO
# ══════════════════════════════════════════
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpaas-minio-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.minio.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-minio
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpaas-minio
  template:
    metadata:
      labels:
        app: cpaas-minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command: [server, /data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: MINIO_SECRET_KEY
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cpaas-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-minio
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
{{- end }}
