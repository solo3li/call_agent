---
# ══════════════════════════════════════════
# GO AI AGENT — Deployment + Service
# ══════════════════════════════════════════
{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpaas-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: cpaas-agent
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      app: cpaas-agent
  template:
    metadata:
      labels:
        app: cpaas-agent
    spec:
      containers:
        - name: agent
          image: {{ .Values.agent.image }}
          imagePullPolicy: {{ .Values.agent.imagePullPolicy }}
          env:
            - name: LIVEKIT_URL
              value: "ws://cpaas-livekit:7880"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: LIVEKIT_API_SECRET
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: GEMINI_API_KEY
            - name: FREESWITCH_ESL_HOST
              value: "cpaas-freeswitch:8021"
            - name: FREESWITCH_ESL_PASS
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: ESL_PASSWORD
            - name: BACKEND_API_URL
              value: "http://cpaas-backend:8080"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cpaas-secrets
                  key: INTERNAL_API_KEY
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cpaas-agent
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: cpaas-agent
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
